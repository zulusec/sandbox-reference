name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the checkout. A repository whose subject is
# least privilege should not ship a job with the default write token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A probe talks to a live container over docker exec, so a hung target
    # would otherwise sit here until the six hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # The end-to-end tests skip themselves when Docker is absent, and a
      # skipped test is a green check that proves nothing. GitHub runners
      # ship Docker, so if this step fails the job fails here rather than
      # passing with the containment claim quietly unchecked.
      - name: Docker must be available, or the containment claim goes unchecked
        run: |
          docker version
          docker compose version

      - run: ruff check .

      # SANDBOX_PROBE_REQUIRE_DOCKER=1 turns every route by which an
      # end-to-end test could decline to run into a failure rather than a
      # skip: the module's own guard raises instead of skipping, and a
      # session hook fails the run if one is skipped from anywhere else.
      # The step above only proves the daemon answered; this proves the
      # containment assertions actually executed. `-ra` keeps any skip
      # visible in the log as well.
      - run: pytest -v -ra
        env:
          SANDBOX_PROBE_REQUIRE_DOCKER: "1"
