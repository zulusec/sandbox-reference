name: ci

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the checkout. A repository whose subject is
# least privilege should not ship a job with the default write token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A probe talks to a live container over docker exec, so a hung target
    # would otherwise sit here until the six hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # The end-to-end tests skip themselves when Docker is absent, and a
      # skipped test is a green check that proves nothing. GitHub runners
      # ship Docker, so if this step fails the job fails here rather than
      # passing with the containment claim quietly unchecked. `-ra` in the
      # pytest step below reports any skip that happens anyway.
      - name: Docker must be available, or the containment claim goes unchecked
        run: |
          docker version
          docker compose version

      - run: ruff check .
      - run: pytest -v -ra
