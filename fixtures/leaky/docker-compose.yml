# Deliberately broken. Every setting here is the wrong answer, and each one
# is what some real deployment ships by default. Never use this as a base.
services:
  sandbox:
    image: python:3.12-alpine
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      # A tmpfs, not a bind mount from this checkout. The probes need a
      # writable workspace and nothing more, so this is fixture plumbing
      # rather than one of the wrong answers under test. A bind mount here
      # would have Docker create ./workspace owned by root, and `down -v`
      # does not remove it, so a reader who follows the instructions below
      # would be left with a directory in their checkout they cannot delete
      # without sudo.
      - type: tmpfs
        target: /workspace
        tmpfs:
          mode: 01777
      - /:/host:ro                              # invariant 3: host filesystem
      - /var/run/docker.sock:/var/run/docker.sock  # invariant 3: runtime socket
    environment:
      AWS_SECRET_ACCESS_KEY: "AKIAIOSFODNN7EXAMPLEKEYNOTREAL"  # invariant 2
      DATABASE_PASSWORD: "hunter2-not-real"                    # invariant 2
    # no networks key: default bridge, so egress is unrestricted (invariant 1)
    # no mem_limit, no pids_limit (invariant 4)
    # no user, no cap_drop, no read_only (invariants 2 and 3)

  authorized:
    image: python:3.12-alpine
    command: ["python3", "-m", "http.server", "80"]
    # Stands in for a host the sandbox is legitimately allowed to reach, and
    # it is the network probe's positive control, not part of what is under
    # test. With no broker in this stack the probe cannot prove liveness
    # through a proxy the way it does against the reference, so it falls back
    # to reaching `allowed_host` directly. That fallback needs a host that
    # genuinely answers: a `.invalid` name is unreachable for everyone,
    # including a wide-open sandbox, so pointing the control at one would
    # make the probe report "nothing was measured" on the very fixture whose
    # job is to prove the probe can measure. Same reasoning as
    # `unauthorized` below, applied to the other side of the test.

  unauthorized:
    image: python:3.12-alpine
    command: ["python3", "-m", "http.server", "80"]
    # Stands in for a real external host the sandbox has no business
    # reaching. It sits on the same default network as `sandbox`, which has
    # no boundary at all (invariant 1), so the connection succeeds. This
    # exists only because a `.invalid` hostname can never resolve for
    # anyone, including a fully open sandbox; the network probe needs a
    # host that is genuinely reachable to prove the leak is real, and this
    # keeps that host offline and dependency-light instead of naming a real
    # external service. It is not itself part of what is under test.
